{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7a928">
    <title>{% block title %}Catálogo Minimarket{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'CSS/catalogo.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="encabezado">
        <a class="marca-sitio" href="/" aria-label="Inicio, Minimarket">
            <span class="marca-simbolo" aria-hidden="true">A</span>
            <span>Minimarket</span>
        </a>
        <nav class="navegacion" aria-label="Navegación principal">
            <a href="/">Inicio</a>
            <a href="/negocio/">Negocio</a>
            <a href="/categorias/volumen/">Categorías</a>
            <a href="/categorias/resumen/">Resumen</a>
        </nav>
    </header>
    <main class="contenido">
        {% block content %}{% endblock %}
    </main>
    <footer class="pie">
        <a href="/">Minimarket</a>
        <span>Catálogo de productos · 2026</span>
    </footer>
</body>
</html>
